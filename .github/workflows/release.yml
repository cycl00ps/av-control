name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Integra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  release:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build integra-web (linux/amd64)
        working-directory: Integra
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o dist/integra-web ./cmd/integra-web

      - name: Package tarball
        working-directory: Integra
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="integra-web_${VERSION}_linux_amd64"
          mkdir -p "$PKG"
          cp dist/integra-web "$PKG/integra-web"
          cp -r static "$PKG/static"
          cp .env.example "$PKG/.env.example"
          tar -czf "${PKG}.tar.gz" "$PKG"
          # Fail fast if the artifact is missing its payload.
          tar -tzf "${PKG}.tar.gz" | grep -qx "${PKG}/integra-web"
          tar -tzf "${PKG}.tar.gz" | grep -qx "${PKG}/.env.example"
          echo "TARBALL=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Integra/${{ env.TARBALL }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
